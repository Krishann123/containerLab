# ulogd configuration for fw-site-a
# Reads packets that nftables sends to NFLOG group 1 and writes each one to syslog.
# Chain: NFLOG input -> decode packet -> interface names -> IP addresses as text
#        -> one-line text -> syslog output

[global]
logfile="/var/log/ulogd.log"
loglevel=3

plugin="/usr/lib/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/ulogd/ulogd_output_SYSLOG.so"

stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys1:SYSLOG

[log1]
# must match "group 1" in configs/fw-site-a.nft
group=1

[sys1]
facility=LOG_LOCAL4
level=LOG_NOTICE
